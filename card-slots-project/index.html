<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки с контентом</title>
    <link rel="stylesheet" href="card-component.css">
    <script src="card-component.js" defer></script>
</head>
<body>
    <h1>Мои карточки</h1>

    <div class="cards-container">
        <card-component>
            <template slot="header">
                <h2>Заголовок карточки 1</h2>
            </template>
            <template slot="content">
                <p>Текстовое содержание карточки 1. Здесь можно разместить любой текст.</p>
            </template>
        </card-component>

        <card-component>
            <template slot="header">
                <h2>Заголовок карточки 2</h2>
            </template>
            <template slot="content">
                <p>Текстовое содержание карточки 2 с изображением.</p>
                <img src="pic.jpg" alt="Изображение карточки 2" class="card-img" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: block;">
            </template>
        </card-component>

        <card-component>
            <template slot="header">
                <h2>Заголовок карточки 3</h2>
            </template>
            <template slot="content">
                <p>Третья карточка для демонстрации работы компонента.</p>
            </template>
        </card-component>
    </div>
</body>
</html>
